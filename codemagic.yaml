workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    environment:
      vars:
        APP_NAME: "P∆"
        BUNDLE_ID: "ru.profiler.pdelta"
      xcode: latest
      node: 20.11.1
    scripts:
      - name: Install deps
        script: |
          npm i -g @capacitor/cli
      - name: Prepare iOS project
        script: |
          rm -rf ios/App/public || true
          mkdir -p ios/App/public
          cp -R ./www/* ./ios/App/public/

          # создаём пустой Capacitor config, чтобы Xcode проект собрался
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ru.profiler.pdelta",
            "appName": "P∆",
            "bundledWebRuntime": false,
            "webDir": "www"
          }
          EOF

          npx cap sync ios
      - name: Build Xcode
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportOptionsPlist <(cat <<PLIST
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>method</key><string>development</string>
              <key>signingStyle</key><string>manual</string>
              <key>compileBitcode</key><false/>
              <key>stripSwiftSymbols</key><true/>
              <key>destination</key><string>export</string>
            </dict>
            </plist>
            PLIST
            ) \
            -exportPath $CM_BUILD_DIR/export
    artifacts:
      - $CM_BUILD_DIR/export/*.ipa
      - $CM_BUILD_DIR/App.xcarchive
    publishing:
      email:
        recipients:
          - "pixvulian@yandex.ru"
        notify:
          success: true
          failure: true
